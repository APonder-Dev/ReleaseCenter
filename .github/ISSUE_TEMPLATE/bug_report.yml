name: Bug report
description: Report a defect in ReleaseCenter
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit / version
      description: Git commit SHA or tagged version.
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - apps/web
        - apps/api
        - apps/worker
        - packages/database
        - packages/github-client
        - packages/release-engine
        - Other / unsure
    validations:
      required: true
